<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - GeoTechieX</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-blue-50 via-purple-50 to-blue-100 min-h-screen flex items-center justify-center p-4">
    
    <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-8">
        
        <!-- Logo -->
        <div class="text-center mb-8">
            <div class="text-6xl mb-4">🌍</div>
            <h1 class="text-3xl font-bold text-gray-800 mb-2">GeoTechieX Admin</h1>
            <p class="text-gray-600">Central Management Dashboard</p>
        </div>

        <!-- Login Form -->
        <form id="login-form" onsubmit="handleLogin(event)">
            
            <div class="mb-6">
                <label class="block text-gray-700 font-semibold mb-2">Username</label>
                <input type="text" id="username" required
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                    placeholder="Enter admin username">
            </div>

            <div class="mb-6">
                <label class="block text-gray-700 font-semibold mb-2">Password</label>
                <input type="password" id="password" required
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                    placeholder="Enter password">
            </div>

            <div class="mb-6">
                <label class="flex items-center">
                    <input type="checkbox" id="remember" class="mr-2">
                    <span class="text-sm text-gray-600">Remember me for 7 days</span>
                </label>
            </div>

            <button type="submit"
                class="w-full bg-gradient-to-r from-blue-600 to-purple-600 text-white font-bold py-3 rounded-lg hover:shadow-lg transition transform hover:scale-105">
                🔐 Login
            </button>

        </form>

        <!-- Error Message -->
        <div id="error-message" class="hidden mt-4 bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg text-sm">
        </div>

        <!-- Info -->
        <div class="mt-8 text-center text-sm text-gray-500">
            <p>🔒 Secure admin access only</p>
            <p class="mt-2">Default: admin / admin123</p>
        </div>
    </div>

    <script>
        function handleLogin(event) {
            event.preventDefault();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const remember = document.getElementById('remember').checked;

            // Simple authentication - REPLACE with secure backend auth
            if (username === 'geotechiex' && password === 'Companybazzly40#') {
                // Set auth token
                const token = 'admin_' + Date.now() + '_' + Math.random().toString(36);
                localStorage.setItem('admin_token', token);
                
                // Set expiry (7 days if remember, 1 day otherwise)
                const expiryDate = new Date();
                expiryDate.setDate(expiryDate.getDate() + (remember ? 7 : 1));
                localStorage.setItem('admin_expiry', expiryDate.toISOString());

                // Redirect to dashboard
                window.location.href = 'dashboard.html';
            } else {
                // Show error
                const errorDiv = document.getElementById('error-message');
                errorDiv.textContent = '❌ Invalid username or password';
                errorDiv.classList.remove('hidden');

                setTimeout(() => {
                    errorDiv.classList.add('hidden');
                }, 3000);
            }
        }

        // Check if already logged in
        window.addEventListener('DOMContentLoaded', () => {
            const adminToken = localStorage.getItem('admin_token');
            const adminExpiry = localStorage.getItem('admin_expiry');
            
            if (adminToken && adminExpiry && new Date(adminExpiry) > new Date()) {
                window.location.href = 'dashboard.html';
            }
        });
    </script>
</body>
</html>
