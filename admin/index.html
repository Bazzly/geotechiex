<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Admin Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-blue-50 via-purple-50 to-blue-100 min-h-screen flex items-center justify-center p-4">
    
    <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-8">
        
        <!-- Logo -->
        <div class="text-center mb-8">
            <div class="text-6xl mb-4">🌍</div>
            <h1 class="text-3xl font-bold text-gray-800 mb-2">GeoTechieX Admin</h1>
            <p class="text-gray-600">Management Dashboard</p>
        </div>

        <!-- Login Form -->
        <form id="loginForm" class="space-y-4">
            
            <div>
                <label class="block text-gray-700 font-semibold mb-2">Username</label>
                <input type="text" id="username" required
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                    placeholder="Enter username">
            </div>

            <div>
                <label class="block text-gray-700 font-semibold mb-2">Password</label>
                <input type="password" id="password" required
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                    placeholder="Enter password">
            </div>

            <div>
                <label class="flex items-center">
                    <input type="checkbox" id="remember" class="mr-2">
                    <span class="text-sm text-gray-600">Remember me for 7 days</span>
                </label>
            </div>

            <button type="submit"
                class="w-full bg-gradient-to-r from-blue-600 to-purple-600 text-white font-bold py-3 rounded-lg hover:shadow-lg transition">
                🔐 Login
            </button>

        </form>

        <!-- Error Message -->
        <div id="errorMessage" class="hidden mt-4 bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg text-sm">
        </div>

        <!-- Info -->
        <div class="mt-8 text-center text-sm text-gray-500">
            <p>🔒 Authorized access only</p>
        </div>
    </div>

    <script>

        // Resolve API endpoint from server config (fallback to same-origin)
        async function resolveApiEndpoint() {
            try {
                const res = await fetch('/api/index.php', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'get_config' })
                });
                const j = await res.json();
                if (j && j.api_base) {
                    window.API_ENDPOINT = j.api_base.replace(/\/$/, '') + '/index.php';
                    return window.API_ENDPOINT;
                }
            } catch (e) { /* ignore */ }
            window.API_ENDPOINT = '/api/index.php';
            return window.API_ENDPOINT;
        }

        // Check if already logged in (validate expiry reliably)
        (function checkAdminSession(){
            const token = localStorage.getItem('admin_token');
            const rawExpiry = localStorage.getItem('admin_expiry') || '';
            const parsed = Date.parse(rawExpiry);
            if (token && !isNaN(parsed) && parsed > Date.now()) {
                window.location.href = 'panel.html';
            }
        })();

        // Handle login with backend authentication
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const remember = document.getElementById('remember').checked;

            try {
                await resolveApiEndpoint();
                const response = await fetch(window.API_ENDPOINT || '/api/index.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        action: 'admin_login',
                        username: username,
                        password: password
                    })
                });
                const data = await response.json();
                if (data.success && data.token && data.expiry) {
                    // Normalize expiry to ISO format. Server returns 'Y-m-d H:i:s' which
                    // may not parse consistently in all browsers. Try to convert safely;
                    let isoExpiry = null;
                    try {
                        // Replace space with 'T' and append Z (UTC) for a reliable parse
                        const cand = data.expiry.replace(' ', 'T') + 'Z';
                        const d = new Date(cand);
                        if (!isNaN(d.getTime())) isoExpiry = d.toISOString();
                    } catch (e) { isoExpiry = null; }
                    if (!isoExpiry) {
                        // fallback: use now + 24 hours (server default) to avoid immediate expiry
                        const d2 = new Date(); d2.setHours(d2.getHours() + 24); isoExpiry = d2.toISOString();
                    }
                    localStorage.setItem('admin_token', data.token);
                    localStorage.setItem('admin_user', username);
                    localStorage.setItem('admin_expiry', isoExpiry);
                    // Optionally extend expiry for remember me
                    if (remember) {
                        const expiry = new Date(isoExpiry);
                        expiry.setDate(expiry.getDate() + 6); // +6 days for 7 total
                        localStorage.setItem('admin_expiry', expiry.toISOString());
                    }
                    window.location.href = 'panel.html';
                } else {
                    showError(data.message || 'Invalid credentials');
                }
            } catch (err) {
                showError('Network or server error');
            }
        });

        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = '❌ ' + message;
            errorDiv.classList.remove('hidden');
            setTimeout(() => {
                errorDiv.classList.add('hidden');
            }, 3000);
        }
    </script>
</body>
</html>
