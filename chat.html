<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoAI Chat — Geospatial Helper</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }
        body {
            display: flex;
            flex-direction: column;
        }
        header {
            flex-shrink: 0;
        }
        .chat-container {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-height: 0;
        }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
            min-height: 0;
        }
        .chat-input-area {
            flex-shrink: 0;
            padding: 1rem;
            border-top: 1px solid #e5e7eb;
            background: #f9fafb;
        }
        .message {
            margin-bottom: 1rem;
            animation: slideIn 0.3s ease-out;
        }
        .message.user {
            display: flex;
            justify-content: flex-end;
        }
        .message.bot {
            display: flex;
            justify-content: flex-start;
        }
        .message-bubble {
            max-width: 70%;
            padding: 0.75rem 1rem;
            border-radius: 0.5rem;
            word-wrap: break-word;
        }
        .message.user .message-bubble {
            background: #3b82f6;
            color: white;
        }
        .message.bot .message-bubble {
            background: #e5e7eb;
            color: #1f2937;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-gradient-to-br from-gray-50 to-gray-100" style="margin: 0; padding: 0;">

    <!-- Header -->
    <header class="bg-gradient-to-r from-blue-600 via-blue-700 to-purple-800 text-white shadow-lg sticky top-0 z-40">
        <div class="container mx-auto px-4 py-4">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-2">
                    <span class="text-2xl">🤖</span>
                    <h1 class="text-2xl font-bold">GeoAI Chat</h1>
                </div>
                <a href="index.html" class="text-white hover:bg-white/10 px-3 py-2 rounded-lg transition text-sm">← Back to Home</a>
            </div>
        </div>
    </header>

    <!-- Chat Container -->
    <div class="chat-container flex-1">
        <div class="chat-messages">
            <div id="messages"></div>
        </div>
        
        <div class="chat-input-area">
            <div class="container mx-auto max-w-2xl">
                <div class="mb-2 text-xs text-gray-600">
                    Try: <code class="bg-white px-2 py-1 rounded">/polygon add 6.5,3.4</code>
                    <code class="bg-white px-2 py-1 rounded ml-2">/polygon export</code>
                    <code class="bg-white px-2 py-1 rounded ml-2">/help</code>
                </div>
                <form id="chat-form" class="flex gap-2">
                    <input 
                        id="chat-input" 
                        type="text" 
                        placeholder="Ask me something or use a command..." 
                        class="flex-1 px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                        autocomplete="off"
                    />
                    <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-lg font-semibold transition">Send</button>
                </form>
            </div>
        </div>
    </div>

    <script src="js/modules/polygon.js"></script>
    <script src="js/chat.js"></script>

</body>
</html>
