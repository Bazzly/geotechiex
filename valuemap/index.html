<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Survey Fee Estimator tool by GeoTechieX">
    <title>Survey Fee Estimator | GeoTechiex</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
</head>

<body class="bg-gray-100 text-gray-900">
    <!-- Header with Navigation -->
    <header class="bg-gradient-to-r from-blue-600 to-purple-800 text-white py-6">
        <div class="container mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between">
                <h1 class="text-2xl font-bold">GeoTechieX</h1>
                <button id="mobile-menu-button" class="block md:hidden">
                    <svg fill="currentColor" viewBox="0 0 20 20" class="w-6 h-6">
                        <path fill-rule="evenodd"
                            d="M3 5a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zM3 10a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zM3 15a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1z"
                            clip-rule="evenodd" />
                    </svg>
                </button>
                <nav id="mobile-menu" class="hidden md:flex flex-col md:flex-row md:space-x-4">
                    <a href="index.html" class="hover:underline block">Home</a>
                    <a href="#services" class="hover:underline block">Services</a>
                    <a href="#contact" class="hover:underline block">Contact Us</a>
                    <a href="/alli-bazeet-damola-profile.html" class="hover:underline block">Profile</a>
                </nav>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container mx-auto px-4 py-8">
        <h2 class="text-3xl font-bold mb-6 text-center text-blue-700">Survey Fee Estimator</h2>
        
        <!-- Controls Section -->
        <div class="bg-white p-6 rounded-lg shadow-md mb-6">
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Latitude</label>
                    <input type="number" id="lat" step="0.0001" 
                        class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Longitude</label>
                    <input type="number" id="lng" step="0.0001" 
                        class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Buffer Radius (km)</label>
                    <input type="number" id="buffer" value="5" step="0.1" 
                        class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Land in (sqmts)</label>
                    <input type="number" id="landsqmts" value="5" step="0.1" 
                        class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
                </div>
                <div class="flex items-end">
                    <button onclick="geolocate()" 
                        class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
                        Use My Location
                    </button>
                </div>
            </div>
            <button onclick="analyzeArea()" 
                class="w-full md:w-auto px-6 py-3 bg-purple-600 text-white rounded-md hover:bg-purple-700 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:ring-offset-2">
                Analyze Area
            </button>
        </div>

        <!-- Results Section -->
        <div id="result" class="bg-white p-6 rounded-lg shadow-md mb-6 hidden">
            <h3 class="text-xl font-semibold mb-4 text-blue-600">Analysis Results</h3>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4" id="result-content"></div>
        </div>

        <!-- Map Section -->
        <div id="map" class="h-96 w-full rounded-lg shadow-lg border border-gray-200"></div>
    </main>

    <!-- Footer -->
    <footer class="bg-gray-800 text-gray-400 py-6 mt-10">
        <div class="max-w-4xl mx-auto text-center">
            <p>© 2024 GeoTechieX. All Rights Reserved.</p>
            <p class="text-sm">Explore. Innovate. Elevate with GeoTechieX.</p>
        </div>
    </footer>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <script>
        // Initialize the map
        const map = L.map('map').setView([7.5, 3.9], 8);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: 'Map data © OpenStreetMap contributors'
        }).addTo(map);

        let marker, circle;
        let areaData = []; // Will store our GeoJSON data
        const analysisCache = {};

        // Load GeoJSON data with built-up and vacant percentages
        async function loadAreaData() {
            try {
                const response = await fetch('areas.geojson');
                const data = await response.json();
                areaData = data.features;
                console.log('Area data loaded successfully');
                
                // Add markers for each area (optional visualization)
                areaData.forEach(area => {
                    const coords = area.geometry.coordinates;
                    L.marker([coords[1], coords[0]]).addTo(map)
                        .bindPopup(`<b>${area.properties.name}</b><br>Type: ${area.properties.type}`);
                });
            } catch (error) {
                console.error('Error loading area data:', error);
                // Fallback data if GeoJSON fails to load
                areaData = [
                    {
                        "type": "Feature",
                        "properties": {
                            "name": "Default Urban Area",
                            "type": "urban",
                            "built_up": 65,
                            "vacant": 20,
                            "roads": 15
                        },
                        "geometry": {
                            "type": "Point",
                            "coordinates": [3.4, 6.5]
                        }
                    },
                    {
                        "type": "Feature",
                        "properties": {
                            "name": "Default Rural Area",
                            "type": "rural",
                            "built_up": 25,
                            "vacant": 65,
                            "roads": 10
                        },
                        "geometry": {
                            "type": "Point",
                            "coordinates": [3.6, 6.3]
                        }
                    }
                ];
            }
        }

        // Call the function to load data
        loadAreaData();

        function geolocate() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(pos => {
                    document.getElementById('lat').value = pos.coords.latitude.toFixed(6);
                    document.getElementById('lng').value = pos.coords.longitude.toFixed(6);
                    analyzeArea();
                }, () => {
                    alert("Geolocation failed.");
                });
            } else {
                alert("Geolocation not supported.");
            }
        }

        function analyzeArea() {
            const lat = parseFloat(document.getElementById('lat').value);
            const lng = parseFloat(document.getElementById('lng').value);
            const landsize = parseFloat(document.getElementById('landsqmts').value);
            const buffer = parseFloat(document.getElementById('buffer').value) * 1000;

            if (isNaN(lat) || isNaN(lng)) {
                alert("Please enter valid coordinates.");
                return;
            }

            const cacheKey = `${lat.toFixed(4)}_${lng.toFixed(4)}_${buffer}`;

            if (analysisCache[cacheKey]) {
                displayResults(analysisCache[cacheKey], landsize, buffer);
                return;
            }

            if (marker) map.removeLayer(marker);
            if (circle) map.removeLayer(circle);

            marker = L.marker([lat, lng]).addTo(map);
            circle = L.circle([lat, lng], { radius: buffer, color: 'blue', fillOpacity: 0.2 }).addTo(map);
            map.setView([lat, lng], 14);

            // Find the nearest area data point
            let selectedArea = findNearestArea(lat, lng);
            
            // Use the area data for calculations
            const areaType = selectedArea?.properties.type || "rural";
            const builtUp = selectedArea?.properties.built_up || 30;
            const vacant = selectedArea?.properties.vacant || 60;
            const roads = selectedArea?.properties.roads || 10;
            const areaName = selectedArea?.properties.name || "Unclassified Area";

            // Get base fees
            const urbanFee = parseFloat(localStorage.getItem("urbanFee")) || 75000;
            const ruralFee = parseFloat(localStorage.getItem("ruralFee")) || 35000;
            const baseFee = areaType === "urban" ? urbanFee : ruralFee;
            
            // Fee adjustment
            let vacantFactor = calculateVacantFactor(vacant);
            
            const surveyFee = baseFee * vacantFactor;
            const statutoryFee = baseFee * vacantFactor * 0.7;

            // Cache results
            analysisCache[cacheKey] = {
                builtUp: builtUp.toFixed(2),
                vacant: vacant.toFixed(2),
                roads: roads.toFixed(2),
                surveyFee,
                statutoryFee,
                areaType: areaType.charAt(0).toUpperCase() + areaType.slice(1),
                baseFee,
                areaName
            };

            displayResults(analysisCache[cacheKey], landsize, buffer);
        }

        function findNearestArea(lat, lng) {
            let nearestArea = null;
            let minDistance = Infinity;
            
            areaData.forEach(area => {
                const areaCoords = area.geometry.coordinates;
                const distance = Math.sqrt(
                    Math.pow(lng - areaCoords[0], 2) + 
                    Math.pow(lat - areaCoords[1], 2)
                );
                
                if (distance < minDistance) {
                    minDistance = distance;
                    nearestArea = area;
                }
            });
            
            return nearestArea;
        }

        function calculateVacantFactor(vacant) {
            if (vacant < 10) return 1.5;
            if (vacant < 25) return 1.3;
            if (vacant < 50) return 1.1;
            return 1;
        }

        function displayResults(data, landsize, buffer) {
            document.getElementById("result").classList.remove('hidden');
            document.getElementById("result-content").innerHTML = `
                <div class="bg-blue-50 p-4 rounded-lg">
                    <h4 class="font-medium text-blue-800 mb-2">Area Details (${buffer/1000}km radius)</h4>
                    <ul class="space-y-1">
                        <li class="flex justify-between"><span>Location:</span> <span class="font-medium">${data.areaName}</span></li>
                        <li class="flex justify-between"><span>Type:</span> <span class="font-medium ${data.areaType === 'Urban' ? 'text-green-600' : 'text-yellow-600'}">${data.areaType}</span></li>
                        <li class="flex justify-between"><span>Built-up:</span> <span class="font-medium">${data.builtUp}%</span></li>
                        <li class="flex justify-between"><span>Vacant:</span> <span class="font-medium">${data.vacant}%</span></li>
                        <li class="flex justify-between"><span>Roads:</span> <span class="font-medium">${data.roads}%</span></li>
                    </ul>
                </div>
                <div class="bg-purple-50 p-4 rounded-lg">
                    <h4 class="font-medium text-purple-800 mb-2">Fee Calculation</h4>
                    <ul class="space-y-1">
                        <li class="flex justify-between"><span>Base Fee:</span> <span class="font-medium">₦${data.baseFee.toLocaleString()}</span></li>
                        <li class="flex justify-between"><span>Multiplier:</span> <span class="font-medium">${(data.surveyFee/data.baseFee).toFixed(2)}x</span></li>
                        <li class="flex justify-between border-t border-purple-200 mt-2 pt-2"><span class="font-semibold">Survey Fee:</span> <span class="font-bold">₦${(data.surveyFee * landsize).toLocaleString()}</span></li>
                        <li class="flex justify-between border-t border-purple-200 mt-2 pt-2"><span class="font-semibold">Statutory Fee:</span> <span class="font-bold">₦${(data.statutoryFee * landsize).toLocaleString()}</span></li>
                    </ul>
                </div>
            `;
        }
    </script>
</body>
</html>
