<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Admin Panel for Survey Fee Estimator | GeoTechieX">
    <title>Admin Panel | GeoTechiex</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 text-gray-900">
    <!-- Header with Navigation -->
    <header class="bg-gradient-to-r from-blue-600 to-purple-800 text-white py-6">
        <div class="container mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between">
                <h1 class="text-2xl font-bold">GeoTechieX</h1>
                <button id="mobile-menu-button" class="block md:hidden">
                    <svg fill="currentColor" viewBox="0 0 20 20" class="w-6 h-6">
                        <path fill-rule="evenodd"
                            d="M3 5a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zM3 10a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zM3 15a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1z"
                            clip-rule="evenodd" />
                    </svg>
                </button>
                <nav id="mobile-menu" class="hidden md:flex flex-col md:flex-row md:space-x-4">
                    <a href="index.html" class="hover:underline block">Home</a>
                    <a href="#services" class="hover:underline block">Services</a>
                    <a href="#contact" class="hover:underline block">Contact Us</a>
                    <a href="/alli-bazeet-damola-profile.html" class="hover:underline block">Profile</a>
                </nav>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container mx-auto px-4 py-8">
        <div class="max-w-md mx-auto bg-white rounded-xl shadow-md overflow-hidden p-6">
            <h2 class="text-2xl font-bold text-center text-blue-700 mb-6">Admin Panel</h2>
            
            <!-- Login Form -->
            <div id="loginForm">
                <div class="mb-4">
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-2">Enter Password</label>
                    <input type="password" id="password" placeholder="Enter admin password"
                        class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
                </div>
                <button onclick="checkPassword()"
                    class="w-full px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
                    Login
                </button>
            </div>

            <!-- Admin Form (Hidden Initially) -->
            <div id="adminForm" class="hidden mt-6">
                <h3 class="text-xl font-semibold text-purple-700 mb-4">Settings</h3>
                
                <div class="mb-4">
                    <label for="urbanFee" class="block text-sm font-medium text-gray-700 mb-2">Urban Area Base Fee (₦)</label>
                    <input type="number" id="urbanFee" placeholder="75000"
                        class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
                </div>
                
                <div class="mb-4">
                    <label for="ruralFee" class="block text-sm font-medium text-gray-700 mb-2">Rural Area Base Fee (₦)</label>
                    <input type="number" id="ruralFee" placeholder="35000"
                        class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
                </div>
                
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-2">Map Server</label>
                    <select id="mapServer" class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
                        <option value="osm">OpenStreetMap</option>
                        <option value="google">Google Maps</option>
                        <option value="esri">ESRI World Imagery</option>
                        <option value="carto">CartoDB Dark</option>
                    </select>
                </div>
                
                <button onclick="saveSettings()"
                    class="w-full px-4 py-2 bg-purple-600 text-white rounded-md hover:bg-purple-700 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:ring-offset-2">
                    Save Settings
                </button>
                <p id="status" class="mt-3 text-center text-green-600 font-medium"></p>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-gray-800 text-gray-400 py-6 mt-10">
        <div class="max-w-4xl mx-auto text-center">
            <p>© 2024 GeoTechieX. All Rights Reserved.</p>
            <p class="text-sm">Explore. Innovate. Elevate with GeoTechieX.</p>
        </div>
    </footer>

    <script>
        const correctPassword = "geosurvey123"; // ✅ Update your preferred password

        function checkPassword() {
            const input = document.getElementById("password").value;
            if (input === correctPassword) {
                document.getElementById("adminForm").classList.remove("hidden");
                document.getElementById("loginForm").classList.add("hidden");
                
                // Load saved settings
                if (localStorage.getItem("urbanFee")) {
                    document.getElementById("urbanFee").value = localStorage.getItem("urbanFee");
                }
                if (localStorage.getItem("ruralFee")) {
                    document.getElementById("ruralFee").value = localStorage.getItem("ruralFee");
                }
                if (localStorage.getItem("mapServer")) {
                    document.getElementById("mapServer").value = localStorage.getItem("mapServer");
                }
            } else {
                alert("Incorrect password.");
            }
        }

        function saveSettings() {
            const urbanFee = parseFloat(document.getElementById("urbanFee").value);
            const ruralFee = parseFloat(document.getElementById("ruralFee").value);
            const mapServer = document.getElementById("mapServer").value;
            
            if (!isNaN(urbanFee) && !isNaN(ruralFee)) {
                localStorage.setItem("urbanFee", urbanFee);
                localStorage.setItem("ruralFee", ruralFee);
                localStorage.setItem("mapServer", mapServer);
                document.getElementById("status").innerText = "✔️ Settings saved successfully!";
                
                // Clear message after 3 seconds
                setTimeout(() => {
                    document.getElementById("status").innerText = "";
                }, 3000);
            } else {
                alert("Please enter valid fees.");
            }
        }
    </script>
</body>
</html>
