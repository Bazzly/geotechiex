<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Database Diagnostic</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-8">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold mb-6">User Tracking System Diagnostic</h1>
        
        <div class="bg-white rounded-lg shadow p-6 mb-4">
            <h2 class="text-xl font-bold mb-4">Test User Registration</h2>
            
            <div class="mb-4">
                <label class="block mb-2 font-semibold">Email:</label>
                <input type="email" id="test-email" value="test@example.com" 
                    class="w-full border rounded px-4 py-2">
            </div>
            
            <button onclick="testRegistration()" 
                class="bg-blue-600 text-white px-6 py-2 rounded hover:bg-blue-700">
                Test Registration
            </button>
            
            <div id="registration-result" class="mt-4"></div>
        </div>
        
        <div class="bg-white rounded-lg shadow p-6 mb-4">
            <h2 class="text-xl font-bold mb-4">Test Database Connection</h2>
            <button onclick="testDatabase()" 
                class="bg-green-600 text-white px-6 py-2 rounded hover:bg-green-700">
                Test Database
            </button>
            <div id="database-result" class="mt-4"></div>
        </div>
        
        <div class="bg-white rounded-lg shadow p-6">
            <h2 class="text-xl font-bold mb-4">Raw Response</h2>
            <pre id="raw-response" class="bg-gray-100 p-4 rounded text-xs overflow-auto"></pre>
        </div>
    </div>

    <script>
        const API_ENDPOINT = 'https://www.bazzlylinks.com/geotechiex.php';
        
        async function testRegistration() {
            const email = document.getElementById('test-email').value;
            const resultDiv = document.getElementById('registration-result');
            const rawDiv = document.getElementById('raw-response');
            
            resultDiv.innerHTML = '<p class="text-gray-600">Testing registration...</p>';
            
            try {
                const response = await fetch(API_ENDPOINT, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        action: 'register_user',
                        email: email,
                        device_id: 'test_device_' + Date.now(),
                        timestamp: new Date().toISOString()
                    })
                });
                
                const responseText = await response.text();
                rawDiv.textContent = responseText;
                
                console.log('Raw response:', responseText);
                
                let data;
                try {
                    data = JSON.parse(responseText);
                } catch (e) {
                    resultDiv.innerHTML = `
                        <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded">
                            <p class="font-bold">JSON Parse Error</p>
                            <p>Response is not valid JSON</p>
                            <p class="text-sm mt-2">Check Raw Response below</p>
                        </div>
                    `;
                    return;
                }
                
                if (data.success) {
                    resultDiv.innerHTML = `
                        <div class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded">
                            <p class="font-bold">✅ Registration Successful!</p>
                            <p>User ID: ${data.user_id || 'N/A'}</p>
                            <p>Email: ${email}</p>
                        </div>
                    `;
                } else {
                    resultDiv.innerHTML = `
                        <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded">
                            <p class="font-bold">❌ Registration Failed</p>
                            <p>Error: ${data.message}</p>
                        </div>
                    `;
                }
            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded">
                        <p class="font-bold">❌ Network Error</p>
                        <p>${error.message}</p>
                    </div>
                `;
                rawDiv.textContent = error.toString();
            }
        }
        
        async function testDatabase() {
            const resultDiv = document.getElementById('database-result');
            const rawDiv = document.getElementById('raw-response');
            
            resultDiv.innerHTML = '<p class="text-gray-600">Testing database...</p>';
            
            try {
                const response = await fetch(API_ENDPOINT, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        action: 'test'
                    })
                });
                
                const responseText = await response.text();
                rawDiv.textContent = responseText;
                
                const data = JSON.parse(responseText);
                
                if (data.success) {
                    resultDiv.innerHTML = `
                        <div class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded">
                            <p class="font-bold">✅ Database Connected</p>
                            <p>${data.message}</p>
                        </div>
                    `;
                } else {
                    resultDiv.innerHTML = `
                        <div class="bg-yellow-100 border border-yellow-400 text-yellow-700 px-4 py-3 rounded">
                            <p class="font-bold">⚠️ Database Issue</p>
                            <p>${data.message}</p>
                        </div>
                    `;
                }
            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded">
                        <p class="font-bold">❌ Connection Failed</p>
                        <p>${error.message}</p>
                    </div>
                `;
            }
        }
    </script>
</body>
</html>
