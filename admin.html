<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel</title>
    <script src="script.js" defer></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 font-sans">
    <header class="bg-gradient-to-r from-blue-600 to-purple-800 text-white py-6 text-center">
        <h1 class="text-3xl font-bold">Admin Panel</h1>
        <p>Manage GeoJSON Files</p>
    </header>

    <main class="max-w-4xl mx-auto mt-10 p-6 bg-gray-800 rounded-lg shadow-lg">
        <h2 class="text-2xl mb-4 font-semibold">Upload GeoJSON File</h2>
        <form id="uploadForm" class="mb-6">
            <input type="file" id="geojsonFile" name="geojsonFile" accept=".geojson" class="mb-4">
            <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white py-2 px-4 rounded">
                Upload
            </button>
        </form>

        <h2 class="text-2xl mb-4 font-semibold">Manage Files</h2>
        <ul id="fileList" class="list-disc list-inside"></ul>
    </main>

    <footer class="bg-gray-800 text-gray-400 py-6 mt-10 text-center">
        <p>&copy; 2024 GeoTechieX. All Rights Reserved.</p>
    </footer>
</body>
</html>
