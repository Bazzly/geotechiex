<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GeoTechieX AI — Area Delineation Assistant</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@turf/turf"></script>
  <script src="https://unpkg.com/leaflet@1.9.3/dist/leaflet.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.7.5/proj4.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.3/dist/leaflet.css" />
</head>
<body class="bg-gray-900 text-gray-100">

  <header class="bg-gradient-to-r from-blue-700 to-purple-800 text-white text-center p-6 shadow-lg">
    <h1 class="text-3xl font-bold">🧭 GeoTechieX AI Assistant</h1>
    <p class="text-sm text-blue-200">Ask: “Which area delineation does 538156, 787954 fall within?”</p>
  </header>

  <main class="max-w-4xl mx-auto mt-6 bg-gray-800 rounded-lg shadow-lg p-6">
    <div id="chatBox" class="h-96 overflow-y-auto p-4 bg-gray-900 rounded-lg space-y-4">
      <div class="text-gray-500 text-sm italic text-center">Chat started. Ask a question...</div>
    </div>

    <div class="mt-4 flex">
      <input id="userInput" type="text" placeholder="Ask about coordinates..." 
             class="flex-grow px-4 py-2 bg-gray-700 rounded-l-lg text-gray-100 border border-gray-600 focus:ring focus:ring-blue-500" />
      <button id="sendBtn" 
              class="bg-blue-600 hover:bg-blue-700 text-white px-6 rounded-r-lg">
        Send
      </button>
    </div>

    <div id="map" class="mt-6 rounded-lg shadow-lg" style="height: 400px;"></div>
  </main>

  <footer class="text-center text-gray-400 py-6 mt-10">
    <p>© 2025 GeoTechieX | Intelligent Geospatial Insight</p>
  </footer>

  <script>
    const chatBox = document.getElementById("chatBox");
    const userInput = document.getElementById("userInput");
    const sendBtn = document.getElementById("sendBtn");

    // Map initialization (centered roughly on Ogun State)
    let map = L.map('map').setView([7.15, 3.35], 8);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 18,
    }).addTo(map);

    // Define projection (EPSG:26331 — Minna / UTM Zone 31N)
    proj4.defs("EPSG:26331","+proj=utm +zone=31 +ellps=clrk80 +towgs84=-92,-93,122,0,0,0,0 +units=m +no_defs");

    let allLayers = [];

    async function loadGeoData() {
      const files = ["data/PRIME_AREA.geojson", "data/SPECIAL_PRIME_AREA.geojson"];
      for (const file of files) {
        const res = await fetch(file);
        const data = await res.json();
        allLayers.push({ name: data.name || file, data });
      }
    }

    function addMessage(sender, text) {
      const div = document.createElement("div");
      div.className = sender === "user"
        ? "text-right"
        : "text-left text-blue-400";
      div.innerHTML = `<div class="inline-block px-4 py-2 rounded-lg ${sender === 'user' ? 'bg-blue-700' : 'bg-gray-700'}">${text}</div>`;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function parseCoordinates(input) {
      const regex = /(\d{5,})[,\s]+(\d{5,})/;
      const match = input.match(regex);
      if (match) return { x: parseFloat(match[1]), y: parseFloat(match[2]) };
      return null;
    }

    async function processQuery(query) {
      addMessage("user", query);
      addMessage("bot", "Analyzing coordinates...");

      const coords = parseCoordinates(query);
      if (!coords) {
        addMessage("bot", "⚠️ Please include valid coordinates, e.g. `538156, 787954`.");
        return;
      }

      if (!allLayers.length) {
        await loadGeoData();
      }

      const point = turf.point([coords.x, coords.y]);
      let found = null;

      for (const layer of allLayers) {
        for (const feature of layer.data.features) {
          if (turf.booleanPointInPolygon(point, feature)) {
            found = feature.properties.AREA_DEL || layer.name;
            L.geoJSON(feature, {
              style: { color: 'lime', weight: 2 }
            }).addTo(map);
            break;
          }
        }
        if (found) break;
      }

      if (found) {
        addMessage("bot", `✅ Coordinate (${coords.x}, ${coords.y}) is inside the ${found} area.`);
      } else {
        addMessage("bot", `❌ No matching area found or General area for (${coords.x}, ${coords.y}).`);
      }

      // Transform to WGS84 for map centering
      const [lon, lat] = proj4("EPSG:26331", "EPSG:4326", [coords.x, coords.y]);
      map.setView([lat, lon], 11);
      L.marker([lat, lon]).addTo(map);
    }

    sendBtn.addEventListener("click", () => {
      const query = userInput.value.trim();
      if (query) {
        processQuery(query);
        userInput.value = "";
      }
    });

    userInput.addEventListener("keypress", (e) => {
      if (e.key === "Enter") sendBtn.click();
    });

    // Preload data
    loadGeoData();
  </script>
</body>
</html>
